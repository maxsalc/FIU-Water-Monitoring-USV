<!DOCTYPE html>
<html>
<head>
    <title>USV Dashboard</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>USV Water Monitoring Dashboard</h1>

    <p id="status">Checking backend...</p>

    <div id="dashboard-layout">
        <div id="map"></div>

        <div id="telemetry-panel">
            <h2>Telemetry</h2>

            <p>Latitude: <span id="lat">--</span></p>
            <p>Longitude: <span id="lon">--</span></p>
            <p>Battery: <span id="battery">--</span> V</p>
            <p>Temperature: <span id="temp">--</span> °C</p>
            <p>pH: <span id="ph">--</span></p>
            <p>Turbidity: <span id="turbidity">--</span></p>
            <p>TDS: <span id="tds">--</span></p>
            <p>Mode: <span id="mode">--</span></p>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
